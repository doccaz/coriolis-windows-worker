#cloud-config
# =============================================================================
# Harvester cloud-init for the Coriolis Windows-worker BUILD HOST.
# Deploy this as the user-data of an openSUSE Leap 16.0 VM (nested virt ON).
# On first boot it installs KVM/libvirt, drops in the builder, and kicks off a
# one-shot service that produces /var/lib/coriolis-worker-build/output/
# coriolis-windows-worker.qcow2.
#
# GENERATED FILE — edit build/*.sh, windows/* or generate-cloud-init.sh instead.
# =============================================================================
hostname: coriolis-worker-builder
ssh_pwauth: true

package_update: true
packages:
  - qemu-kvm
  - libvirt
  - libvirt-client
  - virt-install
  - qemu-tools
  - xorriso
  - curl
  - jq
  - util-linux

write_files:
  - path: /opt/coriolis-worker/build/config.env
    permissions: '0644'
    encoding: b64
    content: 
  - path: /opt/coriolis-worker/build/download-assets.sh
    permissions: '0755'
    encoding: b64
    content: 
  - path: /opt/coriolis-worker/build/make-config-iso.sh
    permissions: '0755'
    encoding: b64
    content: 
  - path: /opt/coriolis-worker/build/build-worker.sh
    permissions: '0755'
    encoding: b64
    content: 
  - path: /opt/coriolis-worker/build/upload-to-harvester.sh
    permissions: '0755'
    encoding: b64
    content: 
  - path: /etc/systemd/system/coriolis-build.service
    permissions: '0644'
    encoding: b64
    content: 
  - path: /opt/coriolis-worker/windows/autounattend.xml
    permissions: '0644'
    encoding: b64
    content: 
  - path: /opt/coriolis-worker/windows/configure-worker.ps1
    permissions: '0644'
    encoding: b64
    content: 
  - path: /opt/coriolis-worker/windows/cloudbase-init.conf
    permissions: '0644'
    encoding: b64
    content: 
  - path: /opt/coriolis-worker/windows/cloudbase-init-unattend.conf
    permissions: '0644'
    encoding: b64
    content: 

runcmd:
  - [ systemctl, enable, --now, libvirtd ]
  - [ bash, -c, "virsh net-autostart default 2>/dev/null; virsh net-start default 2>/dev/null || true" ]
  - [ systemctl, daemon-reload ]
  # Auto-start the build. Comment this out to build manually with
  #   sudo /opt/coriolis-worker/build/build-worker.sh
  - [ systemctl, enable, --now, coriolis-build.service ]

final_message: "Coriolis worker build host ready. Tail /var/log/coriolis-build.log for progress."
