# =============================================================================
# Smoke-test VM for the built Coriolis Windows worker image on Harvester.
#
# Purpose: prove the captured qcow2 actually boots on virtio before you hand it
# to Coriolis. It is NOT the migration worker Coriolis runs — Coriolis spins up
# its own instance from the registered image. This is just a "does it boot?"
# check, deployed in an isolated namespace.
#
# Prereqs (upload the image into the SAME namespace + name referenced below):
#   UPLOAD_TO_HARVESTER=true \
#   HARVESTER_NAMESPACE=coriolis-worker-test \
#   HARVESTER_IMAGE_NAME=coriolis-windows-worker \
#   HARVESTER_SERVER=https://192.168.86.250 HARVESTER_TOKEN=... \
#   ./build/upload-to-harvester.sh <image.qcow2>
#
# Harvester's per-image storage class name is auto-generated (lh-<uuid>), NOT
# longhorn-<image name>. The __IMAGE_STORAGECLASS__ placeholder below is resolved
# at apply time from the uploaded image's .status.storageClassName.
#
# Apply (resolves + substitutes the storage class for you):
#   make smoke-test
#   # then: virtctl vnc -n coriolis-worker-test coriolis-windows-worker
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: coriolis-worker-test
---
# Boot disk, cloned from the uploaded worker image.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coriolis-windows-worker-disk
  namespace: coriolis-worker-test
  annotations:
    harvesterhci.io/imageId: coriolis-worker-test/coriolis-windows-worker
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi          # >= the image's virtual size (40G worker disk)
  volumeMode: Block
  # Auto-generated per-image storage class (lh-<uuid>), resolved at apply time
  # from `kubectl -n coriolis-worker-test get vmimage coriolis-windows-worker \
  #   -o jsonpath={.status.storageClassName}`.
  storageClassName: __IMAGE_STORAGECLASS__
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: coriolis-windows-worker
  namespace: coriolis-worker-test
  labels:
    harvesterhci.io/creator: harvester
spec:
  runStrategy: RerunOnFailure
  template:
    metadata:
      labels:
        harvesterhci.io/vmName: coriolis-windows-worker
    spec:
      domain:
        machine:
          type: q35            # image was built on q35 (SeaBIOS / MBR)
        cpu:
          cores: 2
        memory:
          guest: 4Gi
        features:
          acpi: {}
          apic: {}
          # Hyper-V enlightenments — standard for stable Windows on KVM.
          hyperv:
            relaxed: {}
            vapic: {}
            spinlocks:
              spinlocks: 8191
        clock:
          utc: {}              # image sets RealTimeIsUniversal=1
          timer:
            hpet:
              present: false
            hyperv: {}
            pit:
              tickPolicy: delay
            rtc:
              tickPolicy: catchup
        devices:
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio    # viostor/vioscsi were made boot-critical (CDDB)
          interfaces:
            # e1000e is in-box on Windows, so first-boot networking works even
            # before the virtio-net driver binds. Switch to model: virtio later.
            # Bridge onto the lab LAN (DHCP 192.168.86.x) like the other lab VMs,
            # instead of pod masquerade which lands on the pod CIDR (10.52.x).
            - name: default
              bridge: {}
              model: e1000e
          inputs:
            - name: tablet
              type: tablet
              bus: usb
        resources:
          requests:
            memory: 4Gi
            cpu: "2"
      networks:
        - name: default
          multus:
            networkName: __BUILD_NETWORK__   # from BUILD_NETWORK in build/config.env
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: coriolis-windows-worker-disk
