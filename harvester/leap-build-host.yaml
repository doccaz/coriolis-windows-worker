# =============================================================================
# Harvester manifests for the Coriolis Windows-worker BUILD HOST.
#
# Do NOT apply this file directly with `kubectl apply -f` — the PVC below
# references the per-image storage class Harvester generates for the Leap image,
# whose name is auto-generated (lh-<uuid>) and only known after the image
# imports. Use `make deploy`, which applies leap-image.yaml first, waits for the
# import, then substitutes __IMAGE_STORAGECLASS__ before applying this file.
#
# Requirements:
#   * Nested virtualization MUST be enabled on the Harvester node that runs this
#     VM, otherwise /dev/kvm is unavailable inside the guest and the Windows
#     install falls back to painfully slow TCG emulation. On the node:
#        # Intel:  echo "options kvm_intel nested=1" >/etc/modprobe.d/kvm.conf
#        # AMD:    echo "options kvm_amd   nested=1" >/etc/modprobe.d/kvm.conf
#     then reload the module / reboot the node. `cpu.model: host-passthrough`
#     below exposes vmx/svm to this guest.
# =============================================================================
---
# Root disk for the build host, provisioned from the Leap image (leap-image.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coriolis-builder-root
  namespace: default
  annotations:
    # Tie this PVC to the Harvester image (namespace/name of the VMImage).
    harvesterhci.io/imageId: default/opensuse-leap-16-cloud
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      # Big enough for the Windows ISO (~6G) + 40G worker disk + compressed output.
      storage: 150Gi
  volumeMode: Block
  # Auto-generated per-image storage class (lh-<uuid>), resolved at deploy time
  # from `kubectl get vmimage opensuse-leap-16-cloud -o jsonpath={.status.storageClassName}`.
  storageClassName: __IMAGE_STORAGECLASS__
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: coriolis-worker-builder
  namespace: default
  labels:
    harvesterhci.io/creator: harvester
spec:
  runStrategy: RerunOnFailure
  template:
    metadata:
      labels:
        harvesterhci.io/vmName: coriolis-worker-builder
    spec:
      domain:
        cpu:
          # host-passthrough surfaces the node's vmx/svm flag for nested KVM.
          cores: 8
          model: host-passthrough
        memory:
          guest: 12Gi
        devices:
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            # Bridge onto the lab LAN (DHCP 192.168.86.x) like the other lab VMs,
            # instead of pod masquerade which lands on the pod CIDR (10.52.x) and
            # isn't reachable from the LAN.
            - name: default
              bridge: {}
              model: virtio
        resources:
          requests:
            memory: 12Gi
            cpu: "8"
      networks:
        - name: default
          multus:
            networkName: __BUILD_NETWORK__   # from BUILD_NETWORK in build/config.env
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: coriolis-builder-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: coriolis-builder-cloudinit
            networkDataSecretRef:
              name: coriolis-builder-cloudinit
