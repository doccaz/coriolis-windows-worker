# cloudbase-init.conf — main config for the Coriolis temporary migration worker.
# Runs on every boot. Coriolis injects the worker's admin password and any
# bootstrap user-data through the destination cloud's metadata service, so we
# enable the common metadata sources plus the WinRM-listener plugin.
[DEFAULT]
username=Admin
groups=Administrators
inject_user_password=true
first_logon_behaviour=no
rename_admin_user=false

config_drive_types=vfat,iso
config_drive_locations=hdd,partition,cdrom

bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\

verbose=true
debug=true
log_dir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
log_file=cloudbase-init.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN
logging_serial_port_settings=

mtu_use_dhcp_config=true
ntp_use_dhcp_config=true

local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\

# Order matters: try config-drive (Harvester/OpenStack), then HTTP (EC2/OpenStack),
# then EC2 and NoCloud config-drive.
metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService,
                  cloudbaseinit.metadata.services.httpservice.HttpService,
                  cloudbaseinit.metadata.services.ec2service.EC2Service,
                  cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService

# Plugins applied on a normal boot. The WinRM plugins (re)create the HTTPS
# listener + cert that Coriolis connects to.
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,
        cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,
        cloudbaseinit.plugins.windows.createuser.CreateUserPlugin,
        cloudbaseinit.plugins.common.setuserpassword.SetUserPasswordPlugin,
        cloudbaseinit.plugins.common.sshpublickeys.SetUserSSHPublicKeysPlugin,
        cloudbaseinit.plugins.windows.winrmlistener.ConfigWinRMListenerPlugin,
        cloudbaseinit.plugins.windows.winrmcertificateauth.ConfigWinRMCertificateAuthPlugin,
        cloudbaseinit.plugins.common.ntpclient.NTPClientPlugin,
        cloudbaseinit.plugins.common.localscripts.LocalScriptsPlugin,
        cloudbaseinit.plugins.common.userdata.UserDataPlugin

allow_reboot=false
stop_service_on_exit=false
check_latest_version=false
